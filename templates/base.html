<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block tytul %}Ramka domowa{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/web_icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/web_icons/favicon.png">
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 1rem; }
    h2 { font-weight: 600; }
    button { background: #333; color: white; border: none; padding: 0.5rem 1.2rem;
             border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button:disabled { background: #999; cursor: default; }
    button.wtorny { background: white; color: #333; border: 1px solid #ccc; }
    nav { display: flex; gap: 0.5rem; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav a { padding: 0.6rem 1rem; text-decoration: none; color: #666;
            border-bottom: 2px solid transparent; margin-bottom: -1px; }
    nav a.aktywna { color: #111; border-bottom-color: #333; font-weight: 600; }
    .panel { background: #f0f0f0; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
    input[type=number], select { padding: 0.35rem; border: 1px solid #ccc;
                                 border-radius: 4px; font-size: 0.95rem; }
  {% block style %}{% endblock %}
  </style>
</head>
<body>
  <h2>Ramka domowa</h2>
  <nav>
    <a href="/" class="{{ 'aktywna' if zakladka == 'zdjecia' }}">Zdjęcia</a>
    <a href="/harmonogram" class="{{ 'aktywna' if zakladka == 'harmonogram' }}">Harmonogram</a>
  </nav>
  {% block tresc %}{% endblock %}
</body>
</html>
